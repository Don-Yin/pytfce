name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m ruff check src/ tests/

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/ -q -p no:cacheprovider

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install wheel and check packaged R pipeline
        run: |
          python -m venv "$RUNNER_TEMP/pytfce-wheel"
          wheel_python="$RUNNER_TEMP/pytfce-wheel/bin/python"
          "$wheel_python" -m pip install dist/*.whl
          "$wheel_python" -m pip check
          cd "$RUNNER_TEMP"
          "$wheel_python" -I - <<'PY'
          from importlib import metadata, resources

          import pytfce

          assert pytfce.__version__ == metadata.version("pytfce")
          pipeline = resources.files("pytfce").joinpath("r_ptfce_pipeline.R")
          assert pipeline.is_file(), "R pipeline is missing from the wheel"
          assert pipeline.read_bytes(), "R pipeline is empty"
          print(f"Installed pytfce {pytfce.__version__}; R pipeline: {pipeline}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
