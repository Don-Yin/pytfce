[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytfce"
version = "0.1.2"
description = "Fast probabilistic Threshold-Free Cluster Enhancement in Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Don Yin", email = "dy323@cam.ac.uk"},
    {name = "Hao Chen", email = "hc666@cam.ac.uk"},
]
keywords = ["neuroimaging", "TFCE", "pTFCE", "VBM", "statistics", "GRF"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # Python 3.12 wheel baselines; newer Pythons resolve compatible newer releases.
    "numpy>=1.26.0",
    "scipy>=1.11.2",
    "connected-components-3d>=3.12.4",
]

[project.optional-dependencies]
plotting = ["matplotlib"]
tui = ["rich"]
all = ["matplotlib", "rich"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Don-Yin/pytfce"
Repository = "https://github.com/Don-Yin/pytfce"
Issues = "https://github.com/Don-Yin/pytfce/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytfce = ["*.R"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE", "C4", "RUF"]
# Scientific text intentionally uses Unicode mathematical notation.
ignore = ["RUF001", "RUF002", "RUF003"]
